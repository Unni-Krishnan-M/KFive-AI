server {
  listen 8080;
  server_name _;
  # Docker service addresses can change when a dependency is recreated.
  # A variable proxy target makes Nginx re-resolve through Docker DNS instead
  # of retaining the address captured when this container started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream backend:5000;
  root /usr/share/nginx/html;
  index index.html;
  # 50 MiB file limit plus bounded multipart framing.
  client_max_body_size 52m;

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The production loopback listener sits behind the operator's TLS proxy.
    # Preserve its sanitized scheme; an absent header remains HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Backend OCR waits at most 65 seconds; keep the proxy window bounded but larger.
    proxy_read_timeout 95s;
    proxy_send_timeout 95s;
  }

  location /socket.io/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
