apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kfive
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kfive
spec:
  selector: {app.kubernetes.io/name: backend}
  ports: [{name: http, port: 5000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kfive
  labels: &labels
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kfive
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: backend}}
  template:
    metadata: {labels: *labels}
    spec:
      nodeSelector: {kubernetes.io/hostname: kfive-control-plane}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [10002]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: kfive-ai-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - {configMapRef: {name: kfive-config}}
            - {secretRef: {name: kfive-secrets}}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /api/v1/readiness, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
            - {name: logs, mountPath: /app/logs}
            - {name: tmp, mountPath: /tmp}
            - {name: ollama-socket, mountPath: /run/ollama-bridge, readOnly: true}
            - {name: repository-importer-socket, mountPath: /run/kfive-repository-importer, readOnly: true}
      volumes:
        - name: repository-importer-socket
          hostPath: {path: /run/kfive-repository-importer, type: Directory}
        - {name: uploads, persistentVolumeClaim: {claimName: backend-uploads}}
        - {name: logs, persistentVolumeClaim: {claimName: backend-logs}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - name: ollama-socket
          hostPath:
            path: /run/kfive-host-ollama
            type: Directory
