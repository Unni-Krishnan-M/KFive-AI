apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: kfive
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: vectors
    app.kubernetes.io/part-of: kfive
spec:
  selector: {app.kubernetes.io/name: chromadb}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: kfive
  labels: &labels
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/component: vectors
    app.kubernetes.io/part-of: kfive
spec:
  serviceName: chromadb
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: chromadb}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chromadb
          image: chromadb/chroma:0.4.24
          imagePullPolicy: IfNotPresent
          env:
            - {name: CHROMA_SERVER_HOST, value: 0.0.0.0}
            - {name: CHROMA_SERVER_HTTP_PORT, value: "8000"}
            - {name: ANONYMIZED_TELEMETRY, value: "false"}
            - {name: CHROMA_LOG_CONFIG, value: /etc/chroma/log_config.yml}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: &chromaProbe
            httpGet: {path: /api/v1/heartbeat, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            <<: *chromaProbe
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /chroma/chroma}
            - {name: log-config, mountPath: /etc/chroma/log_config.yml, subPath: log_config.yml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: chromadb-data}}
        - {name: log-config, configMap: {name: chroma-log-config}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
