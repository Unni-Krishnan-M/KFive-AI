apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
        # kindnet can enforce Service traffic before or after DNAT; permit the
        # exact CoreDNS ClusterIP as well as the selected CoreDNS pods.
        - ipBlock: {cidr: 10.96.0.10/32}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: traefik}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: frontend}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: backend}
      ports: [{protocol: TCP, port: 5000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kfive-observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: frontend}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: backend}
      ports: [{protocol: TCP, port: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backend}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: frontend}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kfive-observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 5000}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: mongodb}
      ports: [{protocol: TCP, port: 27017}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: redis}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: chromadb}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb
  namespace: kfive
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mongodb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: backend}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kfive-observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: subsystem-prober}
      ports: [{protocol: TCP, port: 27017}]
---
