apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluent-bit-datadog-egress
  namespace: kfive-observability
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: fluent-bit}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: TCP, port: 443}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: datadog-receiver}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
        - ipBlock: {cidr: 10.96.0.10/32}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datadog-receiver
  namespace: kfive-observability
  labels: {app.kubernetes.io/part-of: kfive}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: datadog-receiver}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: fluent-bit}
      ports: [{protocol: TCP, port: 8080}]
