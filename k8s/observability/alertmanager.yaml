apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: alertmanager, app.kubernetes.io/part-of: kfive}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
    route:
      receiver: "null"
      group_by: [alertname, component]
      group_wait: 1s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: "null"
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: alertmanager, app.kubernetes.io/component: alerting, app.kubernetes.io/part-of: kfive}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: kfive-observability
  labels: &labels {app.kubernetes.io/name: alertmanager, app.kubernetes.io/component: alerting, app.kubernetes.io/part-of: kfive}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --data.retention=24h
            - --cluster.listen-address=
            - --web.listen-address=:9093
          ports: [{name: http, containerPort: 9093}]
          startupProbe: {httpGet: {path: /-/ready, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true}
            - {name: data, mountPath: /alertmanager}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: alertmanager-config}}
        - {name: data, persistentVolumeClaim: {claimName: alertmanager-data}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
