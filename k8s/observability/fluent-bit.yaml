apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: fluent-bit, app.kubernetes.io/part-of: kfive}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     1
        Daemon                    Off
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        storage.path              /fluent-bit/state
        storage.sync              normal
        storage.checksum          on
        storage.backlog.mem_limit 5M
        storage.max_chunks_up     64
        Grace                     20
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_kfive_*.log
        Parser            kfive_cri
        DB                /fluent-bit/state/tail.db
        DB.Sync           Normal
        Mem_Buf_Limit     10MB
        Buffer_Chunk_Size 32KB
        Buffer_Max_Size   64KB
        Skip_Long_Lines   On
        Read_from_Head    Off
        Refresh_Interval  5
        Rotate_Wait       10
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Use_Tag_For_Meta    On
        Merge_Log           On
        Merge_Log_Key       structured
        Merge_Log_Trim      On
        Keep_Log            Off
        Labels              Off
        Annotations         Off
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off
        Buffer_Size         32k

    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki
        Port        3100
        Uri         /loki/api/v1/push
        labels      job=kfive,namespace=$kubernetes['namespace_name'],container=$kubernetes['container_name']
        line_format json
        Retry_Limit False
        storage.total_limit_size 32M

    @INCLUDE /fluent-bit/etc/optional-output.conf
  parsers.conf: |
    [PARSER]
        Name        kfive_cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-optional-output
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: fluent-bit, app.kubernetes.io/part-of: kfive}
data:
  optional-output.conf: |
    # Intentionally empty. Opt-in overlays may add another bounded output.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kfive-observability
  labels: &labels {app.kubernetes.io/name: fluent-bit, app.kubernetes.io/component: logs, app.kubernetes.io/part-of: kfive}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  template:
    metadata: {labels: *labels}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # kind/containerd writes pod logs root:root 0640 under a root:root 0750
        # directory. Grant read-only group access without running the collector
        # as UID 0 or adding capabilities.
        supplementalGroups: [0]
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.2
          imagePullPolicy: IfNotPresent
          args: [-c, /fluent-bit/etc/fluent-bit.conf]
          ports: [{name: health, containerPort: 2020}]
          startupProbe: {httpGet: {path: /api/v1/health, port: health}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /api/v1/health, port: health}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /api/v1/health, port: health}, periodSeconds: 10, timeoutSeconds: 3}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true}
            - {name: config, mountPath: /fluent-bit/etc/parsers.conf, subPath: parsers.conf, readOnly: true}
            - {name: optional-output, mountPath: /fluent-bit/etc/optional-output.conf, subPath: optional-output.conf, readOnly: true}
            - {name: container-logs, mountPath: /var/log/containers, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: state, mountPath: /fluent-bit/state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: fluent-bit-config}}
        - {name: optional-output, configMap: {name: fluent-bit-optional-output}}
        - {name: container-logs, hostPath: {path: /var/log/containers, type: Directory}}
        - {name: pod-logs, hostPath: {path: /var/log/pods, type: Directory}}
        - {name: state, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
