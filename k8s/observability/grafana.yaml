apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: kfive}
data:
  datasource.yaml: |
    apiVersion: 1
    deleteDatasources:
      - {name: Prometheus, orgId: 1}
      - {name: Loki, orgId: 1}
    datasources:
      - name: Prometheus
        uid: kfive-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: kfive-loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: kfive}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: KFive
        orgId: 1
        folder: KFive
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: kfive}
data:
  kfive-overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(kfive_http_requests_total[5m]))", "legendFormat": "requests/s", "refId": "A"}],
          "title": "Backend request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "process_resident_memory_bytes{job=\"kfive-backend\"}", "legendFormat": "backend RSS", "refId": "A"}],
          "title": "Backend resident memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "kfive-loki"},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 8},
          "id": 3,
          "options": {"showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=\"kfive\",container=\"backend\"} | json", "maxLines": 100, "refId": "A"}],
          "title": "KFive application logs",
          "type": "logs"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [{"options": {"0": {"color": "red", "text": "Unavailable"}, "1": {"color": "green", "text": "Available"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 5, "w": 18, "x": 0, "y": 22},
          "id": 9,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "kfive_subsystem_probe_success", "instant": true, "legendFormat": "{{dependency}}", "refId": "A"}],
          "title": "Independent subsystem probes",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [{"options": {"0": {"color": "red", "text": "Unavailable"}, "1": {"color": "green", "text": "Available"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 17},
          "id": 5,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "kfive_dependency_available", "instant": true, "legendFormat": "{{dependency}}", "refId": "A"}],
          "title": "Subsystem availability",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [{"options": {"0": {"color": "yellow", "text": "Unavailable"}, "1": {"color": "green", "text": "Available"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "yellow", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 17},
          "id": 6,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "max(kfive_gpu_probe_available) or vector(0)", "instant": true, "legendFormat": "GPU", "refId": "A"}],
          "title": "GPU probe availability",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {"defaults": {"max": 1, "min": 0, "unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 17},
          "id": 7,
          "targets": [{"expr": "sum(kfive_gpu_vram_bytes{state=\"used\"}) / sum(kfive_gpu_vram_bytes{state=\"total\"})", "legendFormat": "VRAM", "refId": "A"}],
          "title": "GPU VRAM utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {"defaults": {"unit": "celsius"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 17},
          "id": 8,
          "targets": [{"expr": "kfive_gpu_temperature_celsius", "legendFormat": "GPU {{gpu}}", "refId": "A"}],
          "title": "GPU temperature",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "kfive-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 22},
          "id": 4,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(ALERTS{alertname=\"KFiveBackendUnavailable\",alertstate=\"firing\"}) or vector(0)", "instant": true, "legendFormat": "firing", "refId": "A"}],
          "title": "Firing alerts",
          "type": "stat"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": ["kfive", "backend"],
      "time": {"from": "now-1h", "to": "now"},
      "title": "KFive Overview",
      "uid": "kfive-overview",
      "version": 1
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: dashboards, app.kubernetes.io/part-of: kfive}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kfive-observability
  labels: &labels {app.kubernetes.io/name: grafana, app.kubernetes.io/component: dashboards, app.kubernetes.io/part-of: kfive}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_SERVER_ROOT_URL, value: http://kfive.local:8088/grafana/}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_LOG_MODE, value: console}
          ports: [{name: http, containerPort: 3000}]
          startupProbe: {httpGet: {path: /grafana/api/health, port: http}, failureThreshold: 60, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /grafana/api/health, port: http}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /grafana/api/health, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards/kfive-overview.json, subPath: kfive-overview.json, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: datasource, configMap: {name: grafana-datasource}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboard, configMap: {name: grafana-dashboard}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
