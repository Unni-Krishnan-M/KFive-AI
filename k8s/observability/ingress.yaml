apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: kfive}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: kfive.local
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service: {name: grafana, port: {number: 3000}}
