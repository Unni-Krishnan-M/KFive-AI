apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: kfive}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/index-cache
    ingester:
      wal:
        dir: /var/loki/wal
      chunk_idle_period: 5m
      max_chunk_age: 1h
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 10
      delete_request_store: filesystem
    limits_config:
      retention_period: 24h
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
      per_stream_rate_limit: 1MB
      per_stream_rate_limit_burst: 2MB
      max_line_size: 64KB
      max_entries_limit_per_query: 1000
      max_query_length: 25h
      max_query_lookback: 25h
      max_query_parallelism: 4
      discover_service_name: []
      discover_log_levels: false
      reject_old_samples: true
      reject_old_samples_max_age: 1h
    querier:
      max_concurrent: 2
    frontend:
      max_outstanding_per_tenant: 64
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: kfive-observability
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: logs, app.kubernetes.io/part-of: kfive}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: kfive-observability
  labels: &labels {app.kubernetes.io/name: loki, app.kubernetes.io/component: logs, app.kubernetes.io/part-of: kfive}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{name: http, containerPort: 3100}]
          startupProbe: {httpGet: {path: /ready, port: http}, failureThreshold: 60, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/loki/loki.yaml, subPath: loki.yaml, readOnly: true}
            - {name: data, mountPath: /var/loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: loki-config}}
        - {name: data, persistentVolumeClaim: {claimName: loki-data}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
